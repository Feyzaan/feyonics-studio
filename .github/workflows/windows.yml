name: windows-build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p studio-core
      - run: cargo build --release -p feyonics-studio
      - uses: actions/upload-artifact@v4
        with:
          name: feyonics-studio-windows
          path: target/release/feyonics-studio.exe
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Feyonics Studio (latest build)" --notes "Newest build from main. Unsigned: Windows SmartScreen may warn."
          gh release upload latest target/release/feyonics-studio.exe --clobber
